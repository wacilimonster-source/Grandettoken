[package]
name = "tokenscope"
version = "0.1.14"
description = "多平台 Token 余额监控"
authors = ["wacil"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tokenscope_lib"
# 仅 rlib。Tauri 模板默认带 cdylib/staticlib 是为了移动端,但 Windows GNU 工具链下
# cdylib 会导出全部符号,依赖树规模超过 DLL 导出序号上限(export ordinal too large)。
# 桌面端不需要它们。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 里比对 tauri.conf.json 与 Cargo.toml 的版本号
serde_json = "1"

[dependencies]
# 纯逻辑层(渠道适配、快照推算、密钥存储)。拆出去是为了能独立跑 cargo test,
# 不必把 WebView2 整套链接进测试二进制。
tokenscope-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# 检查更新。公钥写在 tauri.conf.json 的 plugins.updater.pubkey 里,
# 插件自己从 config 读,所以这里不需要 .pubkey(...)。
tauri-plugin-updater = "2"
# 全局快捷键(显示/隐藏面板)。注册全在 Rust 侧(set_config 应用),
# 前端无打包器拿不到插件 JS,所以不经由 capabilities 暴露。
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
# 托盘像素改走 base64 传输(报告 O-9),解码在 set_tray_icon 里
base64 = "0.22"
# 禁止双开(报告 O-3):第二个实例只把已开的窗口唤到前台就退出
tauri-plugin-single-instance = "2"

# 开机自启写 HKCU Run 键,免管理员权限,无外部 DLL 依赖(单 exe 约束)
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
