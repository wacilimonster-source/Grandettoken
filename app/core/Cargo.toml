[package]
name = "tokenscope-core"
version = "0.1.0"
edition = "2021"
description = "TokenScope 的纯逻辑层:渠道适配、快照推算、密钥存储。不依赖 Tauri,便于单元测试。"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order:写回客户端配置时要保留原有键序(默认 BTreeMap 会按字母重排,
# 等于把我们没打算动的部分也"改"了一遍)。indexmap 已在锁文件里,离线可用。
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# fetch_all 的并发防护(gate)、结果去重与凭据 IO 下沉(spawn_blocking)
tokio = { version = "1", features = ["rt", "sync", "time"] }
# 解 Trae 客户端凭据(tc 容器:base64 + SHA-512 派生 + AES-128-CBC)。
# 只用纯 Rust 实现,不引入 C 依赖 —— GNU 工具链下不需要额外的编译产物。
aes = "0.8"
sha2 = "0.10"
base64 = "0.22"
generic-array = "0.14"
