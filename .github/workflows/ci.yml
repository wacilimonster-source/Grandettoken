# CI:core 单测 + 两个 crate 的 check。
#
# 本项目是 Windows-GNU 非官方路径(Tauri 官方只覆盖 MSVC),所以 runner 上要自己
# 装 GNU 工具链。core 是纯逻辑层(不依赖 Tauri/WebView2),测试秒级跑完;
# src-tauri 的 check 不链接 WebView2 运行时也能过 —— 只有真跑 release 时才需要它,
# 而那件事由 release.yml 在打 tag 时做。
#
# 为什么 release 构建不进 CI:单 exe 交付依赖 build/make-webview2-static.ps1 从
# cargo registry 现成产物重打静态加载器归档(那个归档是 gitignore 的,CI 里要现生成),
# 而 Windows runner 上的 GNU ld 链接整套 Tauri 依赖树既慢又脆。真正发布走
# release.yml —— 那条链路本机每次发版都在跑,风险已知。
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# 同一分支上新的 push 取消上一轮:这个仓库单人开发,频繁 push 时排队没有意义。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GNU 工具链是硬约束:MSVC 会让链接阶段失败(LNK2019 ___chkstk_ms),
  # 单 exe 的静态加载器也只有 GNU ld 才能吃下。
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU toolchain + target
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustc -vV

      # Tauri 官方镜像带 mingw-w64(LLVM+MinGW),免去自己下 winlibs 那一大步。
      # install-toolchain.ps1 走的是 winlibs zip,CI 走镜像 —— 产出等价,别混。
      - name: Install MinGW-w64 (LLVM+MinGW distribution)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Wire CC/CXX and GNU binutils onto PATH
        shell: pwsh
        run: |
          $mingw = (Get-Command gcc.exe).Source | Split-Path -Parent
          echo "mingw bin: $mingw"
          # GNU ld/windres 必须比 MSVC 的 link.exe 先被找到,否则 crate-type 与
          # 资源编译都会走错工具。RUSTFLAGS 也钉一遍链接器,双保险。
          echo "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          echo "CC=$mingw\gcc.exe"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "CXX=$mingw\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "RUSTFLAGS=-C linker=$mingw\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          gcc -v

      # 用例数量不要写死在注释里:每加一条测试这行就过时一次,
      # 而「文档与实测不一致」比没有这行注释更误导人。以 cargo 输出为准。
      - name: cargo test (core)
        shell: pwsh
        working-directory: app/core
        # 8 条 #[ignore] 是真机用例 / 基准(要读本机凭据、要打真接口、要写真实文件),
        # doc-test 里另有 1 条忽略的示例。runner 上没有这些前提,跳过是对的。
        # 它们在任何环境都不该自动跑 —— 见各用例的注释。
        run: cargo test --locked

      - name: cargo check --all-targets (core)
        shell: pwsh
        working-directory: app/core
        run: cargo check --all-targets --locked

      # src-tauri 的 check 需要静态 WebView2 加载器归档,而那个归档是 gitignore 的。
      # make-webview2-static.ps1 从 cargo registry 里 Cargo.lock 钉住的那一版
      # webview2-com-sys 取 WebView2LoaderStatic.lib 重打 —— 所以必须先 cargo fetch。
      #
      # 两个坑(第一版在 runner 上就是这么挂的,已修):
      #   ① cargo fetch 必须**带 working-directory**。仓库根目录没有 Cargo.toml,
      #      cargo 会沿目录往上找,找到 app/src-tauri 的那份,然后想改它的 lock ——
      #      `--locked` 当场报 "cannot update the lock file"。
      #   ② pwsh 里 `./build/xxx.ps1` 不能直接执行(不是命令名),要写 `pwsh -File <绝对路径>`。
      #      相对路径也不行:这一步的 working-directory 是 app/src-tauri,`./build/...` 指不到。
      - name: cargo fetch (src-tauri) + static WebView2 loader archive
        shell: pwsh
        working-directory: app/src-tauri
        run: |
          cargo fetch --locked
          pwsh -File ${{ github.workspace }}/build/make-webview2-static.ps1

      - name: cargo check --all-targets (src-tauri)
        shell: pwsh
        working-directory: app/src-tauri
        run: cargo check --all-targets --locked
        # 这里只 check 不 build:check 也要过 build.rs,也就是会真的去链接静态加载器
        # 并把导入表走一遍 —— 单 exe 那条约束在编译期就能发现问题,不必跑完整 release。

      - name: node --check (front-end scripts)
        shell: pwsh
        run: |
          node --check app/src/app.js
          node --check app/src/codex-reset.js
          node --check app/src/google-cloud.js
          node --check app/src-tauri/src/google_cloud_capture.js
          node --check build/verify-form.js
          node --check build/verify-ui-0923.js
          node --check build/shot-panel.js
          node --check build/make-latest-json.js
          node --check build/check-css-forms.js
          node --check build/check-ipc-contract.js
          node --check build/check-silent-failures.js
          node --check build/check-file-size.js

      # 前端 invoke() 的桩在 jsdom 冒烟里对未知命令一律返回 null —— 命令名拼错、
      # 定义漏注册都能「全绿」。这道门从源码实时比对「调用 / 定义 / 注册」三方,
      # 零外部依赖;下面另装 jsdom 跑渲染冒烟。两道门覆盖的是不同层面,都要留。
      - name: IPC contract gate
        shell: pwsh
        run: node build/check-ipc-contract.js

      # 以前 jsdom 冒烟只在某台装了 jsdom 的机器上手工跑,文档却写「182/182 通过」——
      # 换个 clone 目录连脚本都起不来(它曾写死 G:/game/...)。这里把开发期依赖装上再跑,
      # 让前端渲染路径真正进 CI。node_modules 已 gitignore,不会被提交。
      - name: install jsdom (dev-only, not a product dependency)
        shell: pwsh
        run: npm install jsdom --no-save --no-audit --no-fund
      - name: front-end smoke (jsdom)
        shell: pwsh
        run: node build/jsdom-smoke.js

      # Codex 重置顾问是独立模块,jsdom-smoke 只加载 index.html + app.js,
      # 这条专门覆盖重置卡区入口、页签切换、滑块透传与「不自动兑换」。
      - name: Codex reset advisor smoke (jsdom)
        shell: pwsh
        run: node build/verify-codex-reset.js

      - name: Google Cloud credits smoke (jsdom)
        shell: pwsh
        run: node build/verify-google-cloud.js

      # 形态门守卫:吸附条 / 胶囊 / 紧凑条控件这些"整块容器"的 display 必须挂在
      # body.<状态> 下。v0.1.56 的吸附条漏了这道门(.dock-body{display:flex!important}),
      # 面板里它 height:100% 抢走 415px,列表被压成 0 高,整页只剩底栏 ——
      # 纯 CSS 的错,jsdom 不参与布局,所以单独一道闸。
      - name: CSS form gate guard
        shell: pwsh
        run: |
          node build/check-css-forms.js --self-test
          node build/check-css-forms.js

      # 空 catch 门禁。2026-11-12 全量治理时 app.js 里还有 14 处空 catch,其中 5 处
      # 是 IPC **写操作** —— 保存失败时界面回到"看起来没事"的状态,重启才发现设置没生效。
      # 纪律写进 AGENTS.md 三次都没拦住(靠人记),所以改成机器判定:空 catch 必须带
      # `silent: <理由>`,写不出理由说明它不该被吞。--self-test 先证明门禁自己会变红。
      - name: silent-failure gate (empty catch must be claimed)
        shell: pwsh
        run: |
          node build/check-silent-failures.js --self-test
          node build/check-silent-failures.js

      # 文件规模棘轮:app.js 9176 行、inject.rs 7248 行这类文件已经是"改一处不知道
      # 影响哪里"的状态,而每轮自动化改动都会顺手再塞几十行。上限只许下调 ——
      # 清理后不调低,等于把清理出来的空间又送回去。
      - name: file-size guard (do not pile into oversized files)
        shell: pwsh
        run: |
          node build/check-file-size.js --self-test
          node build/check-file-size.js

      # 推送前扫凭据。以前只在本地手动跑 —— 而"只在本地跑"等于"忘了就不跑",
      # 这一步恰恰是最不该忘的。它扫的是 git ls-files,所以 untracked 的文件不会
      # 被算进去(那是设计:只关心真正会推上去的东西)。
      - name: scan for credentials
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build/scan-secrets.ps1
          if ($LASTEXITCODE -ne 0) { throw "credential-like strings found - see the HIT lines above" }
