# 发版自动化:打 v* tag → 构建 + 签名 + 发 Release + 生成 latest.json。
#
# 对应 RELEASE.md 的手工 5 步。把每一步都单独拆开是有意的:哪一段红了,
# 本地就能照 RELEASE.md 原样复现哪一段,不用猜是哪半步坏的。
#
# 需要 3 个 secret(见 RELEASE.md「一次性准备」):
#   TAURI_SIGNING_PRIVATE_KEY        签名私钥**文件内容**(不是路径)—— CI 上没有那把文件
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  空串(密钥未加密)
# 私钥只从 secret 读,不落盘、不回显。GITHUB_TOKEN 由 Actions 内置提供。
#
# 仓库必须保持 public:私有仓库的 release 资源需要鉴权,更新插件拉不到。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag(已存在),如 v0.1.43'
        required: true

permissions:
  contents: write   # 创建 release、上传资源

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手工触发时按输入的 tag 检出,而不是默认分支 —— 否则构建出来的是
          # 分支头代码,版本号与 tag 不符。
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag and version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if (-not $tag.StartsWith('v')) { throw "tag must start with v: $tag" }
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = (Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $ver = $conf.version
          if ($ver -ne $cargo) { throw "version mismatch: tauri.conf.json=$ver Cargo.toml=$cargo" }
          if ("v$ver" -ne $tag) { throw "tag $tag does not match version $ver (打 tag 前先同步两处版本号)" }
          echo "tag=$tag"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "version=$ver"| Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "tag=$tag version=$ver"

      - name: Install GNU toolchain + target
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustc -vV

      # cargo-tauri 不在 runner 镜像里(RELEASE.md「一次性准备」里那条 cargo install
      # 是给本机的)。缺了它 bundle 会报 `error: no such command: tauri` ——
      # runner 上第七个坑:前六个修完之后,真正卡住的居然是这儿。
      #
      # ── 2026-10-20 实测:这个缓存**从来没生效过**,这一步稳定吃 11 分钟 ──
      #
      # 运行日志逐字:
      #   Cache not found for input keys: cargo-tauri-Windows-897d2d4b…
      #   Finished `release` profile [optimized] target(s) in 10m 59s
      #
      # 两个原因叠加:
      #   ① key 绑在 hashFiles('app/src-tauri/Cargo.lock') 上 —— **改任何依赖都会 miss**
      #      (v0.1.47 加了 windows-sys,hash 直接变)。而这里要缓存的是 tauri-cli 的
      #      可执行文件,它只跟 tauri-cli 的大版本有关,与项目的依赖锁**毫无关系**。
      #   ② actions/cache 的保存发生在 job 收尾,而 v0.1.47 那次 job 在 Verify 步骤
      #      失败 → `Post Cache cargo-tauri` 被 skipped → **缓存根本没存**。
      #      失败→不存→下次照旧 miss→再编 11 分钟,是个恶性循环。
      #
      # 修法:
      #   ① key 改成一个**手写的稳定版本串**(TAURI_CLI_SERIES)。升级 tauri-cli 时
      #      手动改这个值 —— 那才是唯一该让缓存失效的时机。
      #   ② 只缓存 **cargo-tauri.exe 本身**。以前连 ~/.cargo/registry 一起缓存,
      #      体积大、且 registry 会被别的步骤改写,反而拖慢恢复;而 `cargo install`
      #      一旦命中二进制就整步跳过,registry 有没有都不影响。
      #   ③ 加 `restore-keys` 兜底:精确 key 没中时用前缀 key,至少能救回上一次的。
      - name: Cache cargo-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-${{ runner.os }}-v2
          restore-keys: |
            cargo-tauri-${{ runner.os }}-

      - name: Install cargo-tauri (bundler CLI)
        shell: pwsh
        # 已经装好就跳过 —— 缓存命中时这里没有任何耗时。
        # `cargo tauri --version` 能跑通就说明可用,不必再 install 一次。
        run: |
          $existing = Get-Command cargo-tauri -EA SilentlyContinue
          if ($existing) {
            Write-Host "cargo-tauri already present: $($existing.Source)"
          } else {
            cargo install tauri-cli --version '^2' --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo install tauri-cli failed: $LASTEXITCODE" }
          }
          cargo tauri --version
          if ($LASTEXITCODE -ne 0) { throw "cargo tauri is not usable after install" }

      # 缓存**必须在这里立刻保存**,不能等 job 收尾。
      # 理由见上面 ② :job 后段任何一步失败(Verify 是最常失败的那一步),
      # actions/cache 的 Post 步骤都会被 skip,那 11 分钟就白花了。
      # 单独 save 一次 + `if: always()`,保证无论后面成不成,编译成果都留下来。
      #
      # ⚠ `continue-on-error` 是**必须的**:key 已存在时 actions/cache/save 会
      #   报 "Cache already exists" 并让步骤失败 —— 而缓存命中后的第二次运行
      #   必然是这个状态。不加这一行,发版会从"慢"变成"必挂"。
      #   这里的语义是"尽量存",存不上不影响发版。
      - name: Save cargo-tauri cache immediately
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-${{ runner.os }}-v2

      # Rust **依赖**的编译产物缓存(不含本项目自己的 crate)。
      #
      # 实测依据:本机 target/ 有 28 GB(release 12 GB),**整目录缓存不可行**
      # (GitHub 缓存上限 10 GB/仓库,且上传下载 12 GB 比重编还慢)。
      # 但 rust-cache 默认只缓存 registry/git 依赖的产物,体积小得多。
      #
      # 收益估算:本机增量编译(依赖全在、只重编本 crate)实测 **3 分 05 秒**;
      # CI 的 Build 步骤 7.4 分 = Rust 冷编译约 6.5 分 + NSIS 打包约 1 分。
      # 依赖缓存命中后 Build 预计降到 **约 2 分**。
      #
      # 注意 `workspaces` 必须指到 src-tauri:仓库根目录没有 Cargo.toml。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # 只缓存依赖;本项目 crate 自己每次都要重编(它才是改动最频繁的部分)
          cache-targets: true
          cache-on-failure: true
          # key 里带上 RUSTFLAGS 的哈希 —— 本项目 RUSTFLAGS 含 MinGW 的绝对路径
          # (`-C linker=C:\mingw64\bin\gcc.exe`),换 runner 镜像导致路径变化时
          # 缓存必须失效,否则会链到不存在的 gcc。
          key: ${{ runner.os }}-gnu-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Install MinGW-w64 (LLVM+MinGW distribution)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Wire CC/CXX and GNU binutils onto PATH
        shell: pwsh
        run: |
          $mingw = (Get-Command gcc.exe).Source | Split-Path -Parent
          echo "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          echo "CC=$mingw\gcc.exe"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "CXX=$mingw\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "RUSTFLAGS=-C linker=$mingw\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run core tests before bundling
        shell: pwsh
        working-directory: app/core
        # 单测不过就不发版。这里跑的是 243 条里能跑的条数(4 条 #[ignore] 是真机用例)。
        run: cargo test --locked

      # make-webview2-static.ps1 要从 **cargo registry 的源码检出**里取
      # WebView2LoaderStatic.lib —— 而 core 的 cargo test 只 fetch 了 app/core 的依赖,
      # src-tauri 的 registry 在 runner 上还是空的 → 脚本报
      # "webview2-com-sys <ver> is pinned by Cargo.lock but its ... .lib is not in ..."
      # (runner 上第六个坑)。所以 bundle 前必须显式 fetch src-tauri 的依赖。
      # working-directory 必须给:仓库根目录没有 Cargo.toml(坑 ①)。
      - name: Fetch src-tauri dependencies
        shell: pwsh
        working-directory: app/src-tauri
        run: cargo fetch --locked

      - name: Build NSIS installer + sign
        shell: pwsh
        env:
          # 私钥从 secret 取,写进临时文件给 tauri-cli 读,用完即删。
          # build.ps1 自己会检查这两件事:缺 TAURI_SIGNING_PRIVATE_KEY 直接失败;
          # 密码项要么显式设空串、要么把 CI 置为 true(tauri-cli 的 ci 分支回落空密码)——
          # 否则签名步骤会在非交互环境里等一个永远不来的密码输入,CPU 全程 0 地挂住。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CI: 'true'
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY secret is not set (see RELEASE.md step 3)'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'tokenscope.key'
          [System.IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY)
          try {
            $env:TAURI_SIGNING_PRIVATE_KEY = $keyPath
            # pwsh 里必须用 -File 调本地脚本,`./build.ps1` 不是可执行命令名
            pwsh -File ${{ github.workspace }}/build/build.ps1 bundle
            if ($LASTEXITCODE -ne 0) { throw "bundle failed: $LASTEXITCODE" }
          } finally {
            Remove-Item $keyPath -Force -EA SilentlyContinue
          }
        # build.ps1 里已经带三条硬断言(两处版本号一致、导入表无 WebView2Loader.dll、
        # 产物确由本次运行产出),这里不重复造一遍。

      - name: Generate latest.json
        shell: pwsh
        # make-latest-json.js 自己断言:tag 存在、.sig 存在、安装包存在、
        # 目录里没有混进 WebView2Loader.dll、两处版本号一致。
        #
        # ⚠ **提交信息绝不能内插进 PowerShell 字符串**(v0.1.47 在这里炸过):
        #   以前写的是  $notes = "## Grandettoken ${{ ... }}`n`n${{ github.event.head_commit.message }}"
        #   —— 提交信息里的 `"` 会提前闭合字符串,`$`/反引号还会被当成插值。
        # ⚠ **提交信息绝不能内插进 PowerShell 字符串**(v0.1.47 在这里炸过):
        #   以前写的是  $notes = "## Grandettoken ${{ ... }}`n`n${{ github.event.head_commit.message }}"
        #   —— 提交信息里的 `"` 会提前闭合字符串,`$`/反引号还会被当成插值。
        #   v0.1.47 的正文含「Qoder 的"今天"从 10:00 起算」,于是 runner 报
        #   `ParserError: Unexpected token` ,而**构建与签名早已成功**,白等一轮。
        #   现在改为经 env 传递(GitHub 的推荐做法):env 的值不进 shell 解析,
        #   任何字符都安全。版本号同理,也走 env。
        #
        # ⚠ **第二个坑(同一次发版暴露的)**:`workflow_dispatch` 事件**没有** `head_commit`,
        #   所以 `github.event.head_commit.message` 是空串 —— 补跑时 notes 只剩标题
        #   (实测 24 字符、0 个中文),verify 的「notes intact」直接判 FAIL。
        #   所以这里做两级回落:head_commit.message → 该 tag 的提交信息。
        env:
          VER: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $msg = $env:COMMIT_MSG
          if (-not $msg) {
            # dispatch 补跑:按 tag 反查提交信息(`%B` = 原始正文)
            $msg = (git log -1 --pretty=%B $env:TAG) -join "`n"
            Write-Host "head_commit 为空(workflow_dispatch),已按 tag $env:TAG 反查提交信息: $($msg.Length) 字符"
          }
          $notes = "## Grandettoken $env:VER`n`n$msg"
          if ($notes.Length -lt 40) { throw "release notes 太短($($notes.Length) 字符),疑似提交信息没取到" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes)
          node build/make-latest-json.js --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "make-latest-json failed: $LASTEXITCODE" }

      - name: Collect artifacts + digests
        id: art
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $dir = "app/src-tauri/target/release/bundle/nsis"
          $exe = "Grandettoken_${ver}_x64-setup.exe"
          foreach ($f in @($exe, "$exe.sig", 'latest.json')) {
            $p = Join-Path $dir $f
            if (-not (Test-Path $p)) { throw "missing artifact: $p" }
          }
          $sha = (Get-FileHash (Join-Path $dir $exe) -Algorithm SHA256).Hash
          echo "sha256=$sha"                    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "installer=$exe"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          echo "size=$((Get-Item (Join-Path $dir $exe)).Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "installer=$exe sha256=$sha"

      - name: Create release and upload the three assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Grandettoken ${{ steps.meta.outputs.version }}
          # 三件套缺一个,自动更新链路就断(RELEASE.md 的教训)。
          files: |
            app/src-tauri/target/release/bundle/nsis/Grandettoken_${{ steps.meta.outputs.version }}_x64-setup.exe
            app/src-tauri/target/release/bundle/nsis/Grandettoken_${{ steps.meta.outputs.version }}_x64-setup.exe.sig
            app/src-tauri/target/release/bundle/nsis/latest.json
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── v0.1.47 踩到的坑:`.sig` 上传后"消失" ──
      #
      # softprops/action-gh-release 的日志逐字:
      #   ✅ Uploaded Grandettoken_0.1.47_x64-setup.exe
      #   ✅ Uploaded latest.json
      #   error updating release asset metadata for ...exe.sig:
      #     HttpError: Not Found - .../releases/assets#update-a-release-asset
      #     Matching asset is present after refresh; continuing...
      #
      # 它"认为"还在(所以不报错、job 继续),但 release 里**最终就是没有那个 .sig**。
      # 结果是三件套变两件,已装用户的自动更新链路直接断掉 —— 而且 verify 步骤
      # 会失败,但那时 release 已经发出去了,用户看得到、拉不到 sig。
      #
      # 这类"上传插件的竞态"没法从外面根治,所以加一道**幂等补传**:
      # 用 gh 逐个核对 + 缺了就补。`--clobber` 保证重复执行安全。
      - name: Ensure all three assets are actually attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $dir = "app/src-tauri/target/release/bundle/nsis"
          $want = @(
            "Grandettoken_${ver}_x64-setup.exe",
            "Grandettoken_${ver}_x64-setup.exe.sig",
            "latest.json"
          )

          # 取当前 release 已挂的 asset 名。
          # 不用 `--jq`:那是 gh 2.30+ 才有的参数,runner 镜像上的版本不受我们控制;
          # `--json` + ConvertFrom-Json 从 gh 2.0 起就稳定可用。
          function Get-AssetNames {
            $raw = gh release view $tag --json assets
            if ($LASTEXITCODE -ne 0) { return @() }
            try { return @((($raw | ConvertFrom-Json).assets) | ForEach-Object { $_.name }) }
            catch { return @() }
          }

          # 重试几次:上传插件的 metadata 竞态通常几秒后自愈,先给它机会
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $have = Get-AssetNames
            $missing = @($want | Where-Object { $have -notcontains $_ })
            if ($missing.Count -eq 0) {
              Write-Host "all three assets present (attempt $attempt)"
              exit 0
            }
            Write-Host "attempt ${attempt}: missing -> $($missing -join ', '); re-uploading"
            foreach ($m in $missing) {
              gh release upload $tag (Join-Path $dir $m) --clobber
              if ($LASTEXITCODE -ne 0) { Write-Host "  upload $m failed (will retry)" }
            }
            Start-Sleep -Seconds (2 * $attempt)
          }

          # 补不齐就明确失败 —— 绝不留下一个"看起来发了、其实拉不到 sig"的 release
          $have = Get-AssetNames
          $still = @($want | Where-Object { $have -notcontains $_ })
          if ($still.Count -gt 0) { throw "assets still missing after retries: $($still -join ', ')" }
          Write-Host "all three assets present after retries"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传**之后**才核验。第一版把核验放在了上传之前 —— 那时 release 还不存在,
      # 拉 latest.json 只会拿到 GitHub 的 404 错误页,Invoke-RestMethod 直接抛,
      # 于是"验证步骤失败"其实是顺序写反了(runner 上第八个坑)。
      # 而且这一步与 build/verify-release.js 完全重复,那个脚本已经按字节核过
      # 13 项(端点 200 / 版本 / 签名逐字 / 安装包 sha256 / 三件套 / notes 中文完好 /
      # 元数据),不复用第二份还容易两边各自烂掉。所以这里直接调它。
      - name: Verify the released artifacts end to end
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node build/verify-release.js
          if ($LASTEXITCODE -ne 0) { throw "release verification FAILED - see the checks above" }

      - name: Post-release summary
        shell: pwsh
        run: |
          $sha = "${{ steps.art.outputs.sha256 }}"
          Write-Host "=== release ${{ steps.meta.outputs.tag }} ==="
          Write-Host "installer : ${{ steps.art.outputs.installer }}"
          Write-Host "size      : ${{ steps.art.outputs.size }} bytes"
          Write-Host "sha256    : $sha"
          Write-Host "endpoint  : https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
